<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zakupy</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { padding: 2rem; }
        td .fa-trash { cursor: pointer; color: #dc3545; }
        td .fa-trash:hover { color: #a71d2a; }
        #notify-container { position: absolute; top: 1rem; right: 2rem; cursor: pointer; }
        #notify-icon { font-size: 1.5rem; transition: color 0.3s; }
        tr.highlight td {
            background-color: #fff3cd !important; /* highlight yellow */
            transition: background-color 1.5s ease;
        }
        tr.highlight.fadeout td {
            background-color: white !important;
        }
    </style>
</head>
<body class="container position-relative">

<div class="d-flex align-items-center mb-3">
    <h2 class="me-3 mb-0">Lodówka</h2>
    <button id="fill-fridge-btn" class="btn btn-primary btn-sm me-3">Napełnij lodówkę</button>
    <button id="empty-fridge-btn" class="btn btn-warning btn-sm">Opróżnij lodówkę</button>
</div>
<table id="fridge-table" class="table table-bordered table-striped table-hover align-middle">
    <thead class="table-info">
    <tr>
        <th style="width:60px;">ID</th>
        <th>Name</th>
        <th>Count</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>

<h2 class="mb-4">Zakupy</h2>

<!-- Notification bell -->
<div id="notify-container">
    <i id="notify-icon" class="fa fa-bell text-secondary"></i>
    <span id="notify-badge" class="badge bg-danger rounded-pill d-none">!</span>
</div>

<!-- Table -->
<table id="item-table" class="table table-striped table-bordered align-middle">
    <thead class="table-info">
    <tr>
        <th style="width:60px;">ID</th>
        <th>Produkt</th>
        <th>Ilość</th>
        <th style="width:50px;"></th>
    </tr>
    </thead>
    <tbody></tbody>
    <tfoot>
    <tr>
        <td class="text-muted"></td>
        <td><input type="text" id="new-name" class="form-control" placeholder="Name" required></td>
        <td><input type="number" id="new-count" class="form-control" placeholder="Count" required></td>
        <td class="text-center">
            <button id="add-btn" class="btn btn-success btn-sm"><i class="fa fa-plus"></i></button>
        </td>
    </tr>
    </tfoot>
</table>

<script>



    const API_BASE = "http://localhost:8080";
    const tableBody = document.querySelector("#item-table tbody");
    const nameInput = document.getElementById("new-name");
    const countInput = document.getElementById("new-count");
    const addBtn = document.getElementById("add-btn");
    const notifyIcon = document.getElementById("notify-icon");
    const notifyBadge = document.getElementById("notify-badge");

    const recentAdded = new Set();

    const fridgeBody = document.querySelector("#fridge-table tbody");
    const fillFridgeBtn = document.getElementById("fill-fridge-btn");

    async function loadFridgeItems() {
        try {
            const res = await fetch(`${API_BASE}/fridges/tom`);
            if (!res.ok) throw new Error(`GET /fridges/tom failed: ${res.status}`);
            const data = await res.json();
            const items = data.basic
            fridgeBody.innerHTML = "";
            items.forEach(item => {
                const row = document.createElement("tr");
                row.innerHTML = `
        <td>${item.id}</td>
        <td>${item.name}</td>
        <td>${item.count}</td>
      `;
                fridgeBody.appendChild(row);
            });
        } catch(err){ console.error(err); }
    }

    fillFridgeBtn.addEventListener("click", async () => {
        fillFridgeBtn.disabled = true;
        try {
            const res = await fetch(`${API_BASE}/fridges/tom/fill`, {
                method: "POST"
            });
            if(!res.ok) throw new Error(`POST /fridges/tom/fill failed: ${res.status}`);

            // Reload fridge table after successful fill
            await loadFridgeItems();
        } catch(err) {
            console.error(err);
            alert("Nie udało się napełnić lodówki!");
        } finally {
            fillFridgeBtn.disabled = false;
        }
    });

    const emptyFridgeBtn = document.getElementById("empty-fridge-btn");

    emptyFridgeBtn.addEventListener("click", async () => {
        emptyFridgeBtn.disabled = true;
        try {
            const res = await fetch(`${API_BASE}/fridges/tom/empty`, {
                method: "POST"
            });
            if(!res.ok) throw new Error(`POST /fridges/tom/empty failed: ${res.status}`);

            // Reload fridge table after empty
            await loadFridgeItems();
        } catch(err) {
            console.error(err);
            alert("Nie udało się opróżnić lodówki!");
        } finally {
            emptyFridgeBtn.disabled = false;
        }
    });

    // Render a single row
    function renderRow(item) {
        const key = `${item.name}`;
        const row = document.createElement("tr");
        row.dataset.key = key;
        row.innerHTML = `
        <td>${item.id}</td>
        <td>${item.name}</td>
        <td>${item.count}</td>
        <td class="text-center">
          <i class="fa fa-trash" title="Delete"></i>
        </td>
      `;
        row.querySelector(".fa-trash").addEventListener("click", () => deleteItem(item.name, row));
        return row;
    }

    // Insert or update row, keep table sorted by ID
    function renderOrUpdateRow(item) {
        const key = `${item.name}`;
        let row = document.querySelector(`tr[data-key="${key}"]`);

        if (row) {
            // Update row contents
            row.cells[0].textContent = item.id;
            row.cells[1].textContent = item.name;
            row.cells[2].textContent = item.count;

            // Remove row to re-insert in sorted position
            row.remove();
        } else {
            row = renderRow(item);
        }

        // Insert sorted by ID
        let inserted = false;
        for (const existingRow of tableBody.querySelectorAll("tr")) {
            const existingId = parseInt(existingRow.cells[0].textContent, 10);
            if (item.id < existingId) {
                tableBody.insertBefore(row, existingRow);
                inserted = true;
                break;
            }
        }
        if (!inserted) tableBody.appendChild(row);

        // Highlight new/updated row
        row.classList.add("highlight");
    }

    // Initial load
    async function loadItems() {
        try {
            const res = await fetch(`${API_BASE}/items`);
            if (!res.ok) throw new Error(`GET /items failed: ${res.status}`);
            const items = (await res.json()).sort((a,b)=>a.id-b.id);
            tableBody.innerHTML = "";
            items.forEach(item => tableBody.appendChild(renderRow(item)));
        } catch(err){ console.error(err); }
    }

    // Add/update item via PUT
    addBtn.addEventListener("click", async () => {
        const name = nameInput.value.trim();
        const count = parseInt(countInput.value, 10);
        if(!name || Number.isNaN(count)) return;

        addBtn.disabled = true;
        try {
            const res = await fetch(`${API_BASE}/items`, {
                method: "PUT",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({name,count})
            });
            if(!res.ok) throw new Error(`PUT failed: ${res.status}`);
            const item = await res.json();
            recentAdded.add(`${item.name}:${item.count}`);
            renderOrUpdateRow(item);

            nameInput.value="";
            countInput.value="";
        } catch(err){ console.error(err); }
        finally{ addBtn.disabled=false; }
    });

    // Delete item
    async function deleteItem(name,row) {
        if(!confirm("Delete this item?")) return;
        try {
            const res = await fetch(`${API_BASE}/items/${name}`, {method:"DELETE"});
            if(!res.ok) throw new Error(`DELETE failed: ${res.status}`);
            row.remove();
        } catch(err){ console.error(err); }
    }

    // WebSocket
    function setupWebSocket() {
        let ws;
        let reconnectDelay = 2000;

        const connect = () => {
            ws = new WebSocket("ws://localhost:8080/notifications");

            ws.onopen = () => {
                reconnectDelay = 2000;
                notifyBadge.classList.add("d-none");
                notifyIcon.className = "fa fa-bell text-primary";
            };

            ws.onmessage = (msg) => {
                try {
                    const item = JSON.parse(msg.data);
                    const key = `${item.name}`;
                    if(recentAdded.has(key)){ recentAdded.delete(key); return; }

                    notifyBadge.classList.remove("d-none");
                    notifyIcon.className="fa fa-bell text-warning";

                    renderOrUpdateRow(item);

                } catch(e){ console.warn("WS error:", msg.data); }
            };

            ws.onclose = () => {
                notifyIcon.className="fa fa-bell fa-spin text-secondary";
                setTimeout(connect, reconnectDelay);
                reconnectDelay = Math.min(30000, reconnectDelay*2);
            };
            ws.onerror = () => ws.close();
        };
        connect();
    }

    // Notification bell click
    document.getElementById("notify-container").addEventListener("click", () => {
        notifyBadge.classList.add("d-none");
        notifyIcon.className="fa fa-bell text-primary";
        document.querySelectorAll("tr.highlight").forEach(tr => {
            tr.classList.add("fadeout");
            setTimeout(() => tr.classList.remove("highlight","fadeout"), 1500);
        });
    });

    loadFridgeItems();
    loadItems();
    setupWebSocket();
</script>
</body>
</html>
