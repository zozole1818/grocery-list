<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Items</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
    <style>
        body { padding: 2rem; }
        .notification { position: relative; cursor: pointer; }
        .notification .badge {
            position: absolute; top: -6px; right: -6px;
            background: #dc3545; color: #fff; border-radius: 999px; padding: .25rem .45rem;
        }
        td .fa-trash { cursor: pointer; color: #dc3545; }
        td .fa-trash:hover { color: #a71d2a; }
        .spinner {
            display: inline-block; width: 1rem; height: 1rem; border: .15rem solid rgba(0,0,0,.15);
            border-top-color: rgba(0,0,0,.6); border-radius: 50%; animation: spin .8s linear infinite;
            margin-left: .5rem; vertical-align: -2px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="container">
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Items</h2>
    <div class="notification" id="notify">
        <i id="notify-icon" class="fa-solid fa-bell fa-2x text-secondary"></i>
        <span id="notify-badge" class="badge d-none">!</span>
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <div class="d-flex align-items-center mb-2">
            <h5 class="card-title mb-0">Current Items</h5>
            <span id="loading" class="spinner ms-2 d-none" title="Loading…"></span>
        </div>

        <div class="table-responsive">
            <table id="item-table" class="table table-striped table-bordered align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Name</th>
                    <th style="width:140px">Count</th>
                    <th style="width:70px" class="text-center">Delete</th>
                </tr>
                </thead>
                <tbody>
                <!-- Filled dynamically -->
                </tbody>
                <tfoot>
                <tr>
                    <td>
                        <input type="text" id="new-name" class="form-control" placeholder="Name" required />
                    </td>
                    <td>
                        <input type="number" id="new-count" class="form-control" placeholder="Count" min="0" required />
                    </td>
                    <td class="text-center">
                        <button id="add-btn" class="btn btn-success btn-sm" title="Add item">
                            <i class="fa fa-plus"></i>
                        </button>
                    </td>
                </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>

<script>
    const API_BASE = "http://localhost:8080";
    const tableBody = document.querySelector("#item-table tbody");
    const addBtn = document.getElementById("add-btn");
    const nameInput = document.getElementById("new-name");
    const countInput = document.getElementById("new-count");
    const notifyIcon = document.getElementById("notify-icon");
    const notifyBadge = document.getElementById("notify-badge");
    const loading = document.getElementById("loading");

    // ---- Rendering ----
    function renderRows(items) {
        const frag = document.createDocumentFragment();
        items.forEach(item => {
            const tr = document.createElement("tr");
            tr.dataset.id = item.id; // hidden ID storage
            tr.innerHTML = `
          <td>${escapeHtml(item.name)}</td>
          <td>${Number(item.count)}</td>
          <td class="text-center">
            <button class="btn btn-outline-danger btn-sm" title="Delete">
              <i class="fa fa-trash"></i>
            </button>
          </td>
        `;
            tr.querySelector("button").addEventListener("click", () => deleteItem(item.id, tr));
            frag.appendChild(tr);
        });
        tableBody.innerHTML = "";
        tableBody.appendChild(frag);
    }

    function escapeHtml(s) {
        return String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    async function loadItems() {
        loading.classList.remove("d-none");
        try {
            const res = await fetch(`${API_BASE}/items`);
            if (!res.ok) throw new Error(`GET /items failed: ${res.status}`);
            const items = await res.json();
            renderRows(items);
        } catch (err) {
            console.error("Failed to load items:", err);
        } finally {
            loading.classList.add("d-none");
        }
    }

    // ---- Add ----
    addBtn.addEventListener("click", async () => {
        const name = nameInput.value.trim();
        const count = parseInt(countInput.value, 10);
        if (!name || Number.isNaN(count)) return;

        addBtn.disabled = true;
        try {
            const res = await fetch(`${API_BASE}/items`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, count }) // count as number
            });
            if (!res.ok) throw new Error(`POST /items failed: ${res.status}`);
            const created = await res.json(); // expect created item with id
            // Optimistic update: append new row
            renderRows([...(await getCurrentItems()), created]);
            nameInput.value = "";
            countInput.value = "";
        } catch (err) {
            console.error("Failed to add item:", err);
            // fallback: reload full list if append failed
            await loadItems();
        } finally {
            addBtn.disabled = false;
        }
    });

    // Helper to read current table state back to array (for optimistic append)
    async function getCurrentItems() {
        return Array.from(tableBody.querySelectorAll("tr")).map(tr => ({
            id: parseInt(tr.dataset.id, 10),
            name: tr.children[0].textContent,
            count: parseInt(tr.children[1].textContent, 10),
        }));
    }

    // ---- Delete ----
    async function deleteItem(id, rowEl) {
        if (!confirm("Delete this item?")) return;
        rowEl.classList.add("table-danger");
        try {
            const res = await fetch(`${API_BASE}/items/${id}`, { method: "DELETE" });
            if (!res.ok) throw new Error(`DELETE /items/${id} failed: ${res.status}`);
            rowEl.remove();
        } catch (err) {
            console.error("Failed to delete item:", err);
            rowEl.classList.remove("table-danger");
            // fallback: reload to resync
            await loadItems();
        }
    }

    // ---- Notifications via WebSocket ----
    function setupWebSocket() {
        let ws;
        const connect = () => {
            ws = new WebSocket("ws://localhost:8080/notifications");
            ws.onopen = () => {
                notifyIcon.classList.remove("text-danger");
                notifyIcon.classList.add("text-secondary");
            };
            ws.onmessage = async () => {
                // Light up bell and refresh table
                notifyBadge.classList.remove("d-none");
                notifyIcon.classList.remove("text-secondary");
                notifyIcon.classList.add("text-warning");
                await loadItems();
            };
            ws.onclose = () => {
                // show disconnected state and retry
                notifyIcon.classList.remove("text-secondary", "text-warning");
                notifyIcon.classList.add("text-danger");
                setTimeout(connect, 2000);
            };
            ws.onerror = () => {
                ws.close();
            };
        };
        connect();
    }

    // Clicking the bell clears the badge highlight
    document.getElementById("notify").addEventListener("click", () => {
        notifyBadge.classList.add("d-none");
        notifyIcon.classList.remove("text-warning");
        notifyIcon.classList.add("text-secondary");
    });

    // ---- Init ----
    loadItems();
    setupWebSocket();
</script>
</body>
</html>
