<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fridge</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            padding: 2rem;
        }

        td .fa-trash {
            cursor: pointer;
            color: #dc3545;
        }

        td .fa-trash:hover {
            color: #a71d2a;
        }

        #notify-container {
            position: absolute;
            top: 1rem;
            right: 2rem;
            cursor: pointer;
        }

        #notify-icon {
            font-size: 1.5rem;
            transition: color 0.3s;
        }

        tr.highlight td {
            background-color: #fff3cd !important; /* highlight yellow */
            transition: background-color 1.5s ease;
        }

        tr.highlight.fadeout td {
            background-color: white !important;
        }

        .carousel-control-prev-icon,
        .carousel-control-next-icon {
            filter: invert(29%) sepia(99%) saturate(6368%) hue-rotate(210deg) brightness(95%) contrast(101%);
            /* this makes them Bootstrap blue */
        }

        .badge-hover-primary:hover {
            background-color: #0b5ed7 !important; /* darker bootstrap primary */
            color: #fff !important;
        }
        .badge-hover-info:hover {
            background-color: #31d2f2 !important; /* darker bootstrap info */
            color: #000 !important;
        }
    </style>
</head>
<body class="container position-relative">
<nav class="navbar navbar-expand-lg navbar-light bg-light">

</nav>
<div class="container">



    <div class="row">
        <div class="col">
            <div class="container mt-4">
                <div class="card shadow-sm rounded-3 border-0">
                    <div class="card-body">

                        <div class="d-flex align-items-center mb-3">
                            <h4 class="card-title me-3">Fridge</h4>
                            <button id="load-recipes-btn" class="btn btn-primary btn-sm me-3">Load Recipes</button>
                            <button id="fill-fridge-btn" class="btn btn-primary btn-sm me-3">Fill fridge</button>
                            <button id="empty-fridge-btn" class="btn btn-warning btn-sm">Empty fridge</button>
                        </div>


                        <div id="badges" class="d-flex flex-wrap gap-2"></div>

                        <div class="container mt-4">
                            <div class="card shadow-sm rounded-3 border-0">
                                <div class="card-body">
                                    <div class="d-flex align-items-center mb-3">
                                        <h4 class="card-title me-3">Shopping List</h4>


                                        <div class="dropdown">
                                            <button class="btn btn-primary dropdown-toggle d-flex align-items-center" type="button"
                                                    id="emailDropdownBtn" data-bs-toggle="dropdown" aria-expanded="false">
                                                <i class="fa-regular fa-envelope me-1"></i> Send Email
                                            </button>
                                            <ul class="dropdown-menu" aria-labelledby="emailDropdownBtn">
                                                <li><a class="dropdown-item" href="#"
                                                       data-email="zuzua.tel@gmail.com,sebatombdg@gmail.com">all</a></li>
                                                <li><a class="dropdown-item" href="#" data-email="zuzua.tel@gmail.com">zuzua.tel@gmail.com</a>
                                                </li>
                                                <li><a class="dropdown-item" href="#" data-email="sebatombdg@gmail.com">sebatombdg@gmail.com</a>
                                                </li>
                                            </ul>
                                        </div>

                                        <!-- Notification bell -->
                                        <div id="notify-container">
                                            <i id="notify-icon" class="fa fa-bell text-secondary"></i>
                                            <span id="notify-badge" class="badge bg-danger rounded-pill d-none">!</span>
                                        </div>
                                    </div>

                                    <!-- Table -->
                                    <table id="item-table" class="table table-sm table-striped table-bordered align-middle">
                                        <thead class="table-info">
                                        <tr>
                                            <!--        <th style="width:60px;">ID</th>-->
                                            <th>Product</th>
                                            <th>Count</th>
                                            <th style="width:50px;"></th>
                                        </tr>
                                        </thead>
                                        <tbody></tbody>
                                        <tfoot>
                                        <tr>
                                            <!--        <td class="text-muted"></td>-->
                                            <td><input type="text" id="new-name" class="form-control" placeholder="Name" required>
                                            </td>
                                            <td><input type="number" id="new-count" class="form-control" placeholder="Count"
                                                       required></td>
                                            <td class="text-center">

                                                </button>

                                        </tr>

                                </div>
                            </div>
                        </div>


                    </div>
                </div>
            </div>
        </div>
        <div class="col">

            <div id="hiddenDiv" class="d-none container mt-4">

                <h4>
                    Available Recipes <span id="recipe-count" class="badge bg-primary ms-2">0</span>
                </h4>

                <!-- Bootstrap Carousel -->
                <div id="recipeCarousel" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner" id="carouselContainer">
                        <!-- Cards will be inserted dynamically here -->
                    </div>

                    <!-- Carousel controls -->
                    <button class="carousel-control-prev" type="button" data-bs-target="#recipeCarousel"
                            data-bs-slide="prev">

                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#recipeCarousel"
                            data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>
            </div>

            <!--            POTENTIAL RECIPES   -->
            <div id="hiddenDiv2" class="d-none container mt-4">

                <h4>
                    Almost Available Recipes <span id="potential-recipe-count" class="badge bg-secondary ms-2">0</span>
                </h4>

                <!-- Bootstrap Carousel -->
                <div id="recipeCarousel2" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner" id="carouselContainer2">
                        <!-- Cards will be inserted dynamically here -->
                    </div>

                    <!-- Carousel controls -->
                    <button class="carousel-control-prev" type="button" data-bs-target="#recipeCarousel2"
                            data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#recipeCarousel2"
                            data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>
            </div>

        </div>
    </div>

</div>

<!-- Modal -->
<div class="modal fade" id="recipeModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal-title"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer">
                <a id="modal-url" class="btn btn-primary" target="_blank">Go to Recipe</a>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<script>

    let fridgeIngredients = [];
    let shoppingListIngredients = [];


    const API_BASE = "http://localhost:8080";
    const tableBody = document.querySelector("#item-table tbody");
    const nameInput = document.getElementById("new-name");
    const countInput = document.getElementById("new-count");
    const addBtn = document.getElementById("add-btn");
    const notifyIcon = document.getElementById("notify-icon");
    const notifyBadge = document.getElementById("notify-badge");

    const recentAdded = new Set();

    const fridgeBodyBasic = document.querySelector("#fridge-basic-table tbody");
    const fridgeAdditionalBody = document.querySelector("#fridge-additional-table tbody");
    const fillFridgeBtn = document.getElementById("fill-fridge-btn");
    const loadRecipesBtn = document.getElementById("load-recipes-btn");

    document.querySelectorAll(".dropdown-item").forEach(item => {
        item.addEventListener("click", async (e) => {
            e.preventDefault();
            const email = item.getAttribute("data-email");

            try {
                const res = await fetch(`/emails?to=${encodeURIComponent(email)}`, {
                    method: "POST"
                });
                if (res.ok) {
                    alert(`Email request sent to ${email}!`);
                } else {
                    alert("Failed to send email.");
                }
            } catch (err) {
                console.error(err);
                alert("Error sending email.");
            }
        });
    });

    async function loadFridge() {
        const container = document.getElementById("badges");
        container.innerHTML = "Loading…";
        const res = await fetch(`${API_BASE}/fridges/tom`);
        if (!res.ok) throw new Error(`GET /fridges/tom failed: ${res.status}`);
        const data = await res.json();
        fridgeIngredients = [];
        const basicItems = data.basic
        const additionalItems = data.items
        container.innerHTML = "";
        // Sort items by name (case-insensitive)
        basicItems.sort((a, b) => a.name.localeCompare(b.name, 'pl', { sensitivity: 'base' }));
        additionalItems.sort((a, b) => a.name.localeCompare(b.name, 'pl', { sensitivity: 'base' }));


        basicItems.forEach(it => {
            fridgeIngredients.push(it.name);
            const badge = document.createElement("span");
            badge.className =
                "badge rounded-pill bg-primary badge-hover-primary";
            badge.textContent = `${it.name}: ${it.count}`;
            container.appendChild(badge)
        });

        additionalItems.forEach(it => {
            fridgeIngredients.push(it.name);
            const badge = document.createElement("span");
            badge.className =
                "badge rounded-pill bg-info text-dark badge-hover-info";
            badge.textContent = `${it.name}: ${it.count}`;
            container.appendChild(badge)
        });

    }

    fillFridgeBtn.addEventListener("click", async () => {
        fillFridgeBtn.disabled = true;
        try {
            const res = await fetch(`${API_BASE}/fridges/tom/fill`, {
                method: "POST"
            });
            if (!res.ok) throw new Error(`POST /fridges/tom/fill failed: ${res.status}`);

            // Reload fridge table after successful fill
            await loadFridgeItems();
            await loadItems();
        } catch (err) {
            console.error(err);
            alert("Nie udało się napełnić lodówki!");
        } finally {
            fillFridgeBtn.disabled = false;
        }
    });

    loadRecipesBtn.addEventListener("click", async () => {
        loadRecipesBtn.disabled = true;
        try {
            await loadRecipes();
            await loadPotentialRecipes();

        } catch (err) {
            console.error(err);
            alert("Nie udało się pobrac przepisów!");
        } finally {
            loadRecipesBtn.disabled = false;
        }
    });

    const emptyFridgeBtn = document.getElementById("empty-fridge-btn");

    emptyFridgeBtn.addEventListener("click", async () => {
        emptyFridgeBtn.disabled = true;
        try {
            const res = await fetch(`${API_BASE}/fridges/tom/empty`, {
                method: "POST"
            });
            if (!res.ok) throw new Error(`POST /fridges/tom/empty failed: ${res.status}`);

            // Reload fridge table after empty
            await loadFridgeItems();
        } catch (err) {
            console.error(err);
            alert("Nie udało się opróżnić lodówki!");
        } finally {
            emptyFridgeBtn.disabled = false;
        }
    });

    // Render a single row
    function renderRow(item) {
        const key = `${item.name}`;
        const row = document.createElement("tr");
        row.dataset.key = key;
        row.innerHTML = `
<!--        <td>${item.id}</td>-->
        <td>${item.name}</td>
        <td>${item.count}</td>
        <td class="text-center">
          <i class="fa fa-trash" title="Delete"></i>
        </td>
      `;
        row.querySelector(".fa-trash").addEventListener("click", () => deleteItem(item.name, row));
        return row;
    }

    // Insert or update row, keep table sorted by ID
    function renderOrUpdateRow(item) {
        const key = `${item.name}`;
        let row = document.querySelector(`tr[data-key="${key}"]`);

        if (row) {
            // Update row contents
            // row.cells[0].textContent = item.id;
            row.cells[0].textContent = item.name;
            row.cells[1].textContent = item.count;

            // Remove row to re-insert in sorted position
            row.remove();
        } else {
            row = renderRow(item);
        }

        // Insert sorted by ID
        let inserted = false;
        for (const existingRow of tableBody.querySelectorAll("tr")) {
            const existingId = parseInt(existingRow.cells[0].textContent, 10);
            if (item.id < existingId) {
                tableBody.insertBefore(row, existingRow);
                inserted = true;
                break;
            }
        }
        if (!inserted) tableBody.appendChild(row);

        // Highlight new/updated row
        row.classList.add("highlight");
    }

    // Initial load
    async function loadItems() {
        try {
            const res = await fetch(`${API_BASE}/items`);
            if (!res.ok) throw new Error(`GET /items failed: ${res.status}`);
            const items = (await res.json()).sort((a, b) => a.id - b.id);
            shoppingListIngredients = [];
            tableBody.innerHTML = "";
            items.forEach((item) => {
                shoppingListIngredients.push(item.name);
                tableBody.appendChild(renderRow(item))
            });
        } catch (err) {
            console.error(err);
        }
    }

    // Add/update item via PUT
    addBtn.addEventListener("click", async () => {
        const name = nameInput.value.trim();
        const count = parseInt(countInput.value, 10);
        if (!name || Number.isNaN(count)) return;

        addBtn.disabled = true;
        try {
            const res = await fetch(`${API_BASE}/items`, {
                method: "PUT",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({name, count})
            });
            if (!res.ok) throw new Error(`PUT failed: ${res.status}`);
            const item = await res.json();
            recentAdded.add(`${item.name}:${item.count}`);
            shoppingListIngredients.push(item.name);
            renderOrUpdateRow(item);

            nameInput.value = "";
            countInput.value = "";
        } catch (err) {
            console.error(err);
        } finally {
            addBtn.disabled = false;
        }
    });

    // Delete item
    async function deleteItem(name, row) {
        if (!confirm("Delete this item?")) return;
        try {
            const res = await fetch(`${API_BASE}/items/${name}`, {method: "DELETE"});
            if (!res.ok) throw new Error(`DELETE failed: ${res.status}`);
            shoppingListIngredients.splice(shoppingListIngredients.indexOf(name), 1);
            row.remove();
        } catch (err) {
            console.error(err);
        }
    }

    // WebSocket
    function setupWebSocket() {
        let ws;
        let reconnectDelay = 2000;

        const connect = () => {
            ws = new WebSocket("ws://localhost:8080/notifications");

            ws.onopen = () => {
                reconnectDelay = 2000;
                notifyBadge.classList.add("d-none");
                notifyIcon.className = "fa fa-bell text-primary";
            };

            ws.onmessage = (msg) => {
                try {
                    const item = JSON.parse(msg.data);
                    const key = `${item.name}`;
                    if (recentAdded.has(key)) {
                        recentAdded.delete(key);
                        return;
                    }

                    notifyBadge.classList.remove("d-none");
                    notifyIcon.className = "fa fa-bell text-warning";

                    renderOrUpdateRow(item);

                } catch (e) {
                    console.warn("WS error:", msg.data);
                }
            };

            ws.onclose = () => {
                notifyIcon.className = "fa fa-bell fa-spin text-secondary";
                setTimeout(connect, reconnectDelay);
                reconnectDelay = Math.min(30000, reconnectDelay * 2);
            };
            ws.onerror = () => ws.close();
        };
        connect();
    }

    // Notification bell click
    document.getElementById("notify-container").addEventListener("click", () => {
        notifyBadge.classList.add("d-none");
        notifyIcon.className = "fa fa-bell text-primary";
        document.querySelectorAll("tr.highlight").forEach(tr => {
            tr.classList.add("fadeout");
            setTimeout(() => tr.classList.remove("highlight", "fadeout"), 1500);
        });
    });

    async function loadRecipes() {
        const div = document.getElementById("hiddenDiv");
        div.classList.remove("d-none");
        const ingredients = [...fridgeIngredients, ...shoppingListIngredients].join(',');
        const res = await fetch(`http://localhost:8081/recipes?ingredients=${encodeURIComponent(ingredients)}`);
        recipes = await res.json();
        document.getElementById('recipe-count').innerText = recipes.length;

        const container = document.getElementById("carouselContainer");
        container.innerHTML = "";

        recipes.forEach((recipe, idx) => {
            const previewIngredients = recipe.Ingredients.slice(0, 4).join(', ') + (recipe.Ingredients.length > 4 ? '...' : '');
            const courseBadges = recipe.Course?.map(c => `<span class="badge bg-primary text-white me-1">${c}</span>`).join('') || '';
            const tagBadges = recipe.Tags?.map(t => `<span class="badge bg-info text-dark me-1">${t}</span>`).join('') || '';

            const card = `
          <div class="carousel-item ${idx === 0 ? 'active' : ''}">
            <div class="card h-100 shadow-sm mx-auto" style="max-width: 22rem;">
              <div class="card-body d-flex flex-column">
                <h5 class="card-title">
                  <a href="${recipe.Url}" target="_blank" class="text-decoration-none">
                    ${recipe.Title} <i class="fa fa-link ms-1"></i>
                  </a>
                </h5>
                <p class="card-text"><strong>Ingredients:</strong> ${previewIngredients}</p>
                <div class="mb-2">${courseBadges}</div>
                <div class="mb-2">${tagBadges}</div>
                <div class="mt-auto">
                  <button class="btn btn-sm btn-outline-primary" onclick="showRecipeModal(${idx},0)">Show full recipe</button>
                </div>
              </div>
            </div>
          </div>`;
            container.insertAdjacentHTML("beforeend", card);
        });
    }

    async function loadPotentialRecipes() {
        const div = document.getElementById("hiddenDiv2");
        div.classList.remove("d-none");
        const ingredients = [...fridgeIngredients, ...shoppingListIngredients].join(',');
        const res = await fetch(`http://localhost:8081/potential-recipes?ingredients=${encodeURIComponent(ingredients)}`);
        potentialRecipes = await res.json();

        document.getElementById('potential-recipe-count').innerText = potentialRecipes.length;

        const container = document.getElementById("carouselContainer2");
        container.innerHTML = "";

        potentialRecipes.forEach((recipe, idx) => {
            const previewIngredients = recipe.Recipe.Ingredients.slice(0, 4).join(', ') + (recipe.Recipe.Ingredients.length > 4 ? '...' : '');
            const courseBadges = recipe.Recipe.Course?.map(c => `<span class="badge bg-primary text-white me-1">${c}</span>`).join('') || '';
            const tagBadges = recipe.Recipe.Tags?.map((t) => {
                if (recipe.MissingIngredients?.includes(t)) {
                    return `<span class="badge bg-danger text-white me-1">${t}</span>`
                }
                return `<span class="badge bg-info text-dark me-1">${t}</span>`
            }).join('') || '';

            const card = `
          <div class="carousel-item ${idx === 0 ? 'active' : ''}">
            <div class="card h-100 shadow-sm mx-auto" style="max-width: 22rem;">
              <div class="card-body d-flex flex-column">
                <h5 class="card-title">
                  <a href="${recipe.Recipe.Url}" target="_blank" class="text-decoration-none">
                    ${recipe.Recipe.Title} <i class="fa fa-link ms-1"></i>
                  </a>
                </h5>
                <p class="card-text"><strong>Ingredients:</strong> ${previewIngredients}</p>
                <div class="mb-2">${courseBadges}</div>
                <div class="mb-2">${tagBadges}</div>
                <div class="mt-auto">
                  <button class="btn btn-sm btn-outline-primary" onclick="showRecipeModal(${idx},1)">Show full recipe</button>
                </div>
              </div>
            </div>
          </div>`;
            container.insertAdjacentHTML("beforeend", card);
        });
    }

    // Modal function remains unchanged
    function showRecipeModal(idx, type) {
        let recipe;
        if (type === 0) {
            recipe = recipes[idx];
        } else {
            recipe = potentialRecipes[idx].Recipe;
        }
        // const recipe = recipes[idx];
        const tagsHtml = recipe.Tags?.length ? recipe.Tags.map(tag => `<span class="badge bg-info text-dark me-1">${tag}</span>`).join('') : '';
        const courseHtml = recipe.Course?.length ? recipe.Course.map(c => `<span class="badge bg-primary text-white me-1">${c}</span>`).join('') : '';

        document.getElementById('modal-title').innerText = recipe.Title;
        document.getElementById('modal-body').innerHTML = `
        <p><strong>Courses:</strong> ${courseHtml}</p>
        <p><strong>Tags:</strong> ${tagsHtml}</p>
        <h6>Ingredients:</h6>
        <ul>${recipe.Ingredients.map(i => `<li>${i}</li>`).join('')}</ul>
        <h6>Instructions:</h6>
        <ol>${recipe.InstructionsSteps.map(s => `<li>${s}</li>`).join('')}</ol>
    `;
        document.getElementById('modal-url').href = recipe.Url;
        bootstrap.Modal.getOrCreateInstance(document.getElementById('recipeModal')).show();
    }

    loadFridge()
    loadItems();
    setupWebSocket();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
