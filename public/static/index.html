<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zakupy</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            padding: 2rem;
        }

        td .fa-trash {
            cursor: pointer;
            color: #dc3545;
        }

        td .fa-trash:hover {
            color: #a71d2a;
        }

        #notify-container {
            position: absolute;
            top: 1rem;
            right: 2rem;
            cursor: pointer;
        }

        #notify-icon {
            font-size: 1.5rem;
            transition: color 0.3s;
        }

        tr.highlight td {
            background-color: #fff3cd !important; /* highlight yellow */
            transition: background-color 1.5s ease;
        }

        tr.highlight.fadeout td {
            background-color: white !important;
        }
    </style>
</head>
<body class="container position-relative">
<div class="container">
    <div class="row">
        <div class="col">
            <div class="container mt-4">
                <div class="card shadow-sm rounded-3 border-0">
                    <div class="card-body">

                        <div class="d-flex align-items-center mb-3">
                            <h4 class="card-title me-3">Fridge</h4>
                            <button id="fill-fridge-btn" class="btn btn-primary btn-sm me-3">Fill fridge</button>
                            <button id="empty-fridge-btn" class="btn btn-warning btn-sm">Empty fridge</button>
                        </div>

                        <div class="accordion" id="accordionToggleList">

                            <div class="accordion-item">
                                <h2 class="accordion-header" id="panelsStayOpen-headingOne">
                                    <button class="accordion-button py-1 px-2 small" type="button"
                                            data-bs-toggle="collapse"
                                            data-bs-target="#panelsStayOpen-collapseOne" aria-expanded="true"
                                            aria-controls="panelsStayOpen-collapseOne">
                                        Basic products
                                    </button>
                                </h2>
                                <div id="panelsStayOpen-collapseOne" class="accordion-collapse collapse show"
                                     aria-labelledby="panelsStayOpen-headingOne">
                                    <div class="accordion-body">

                                        <table id="fridge-basic-table"
                                               class="table table-sm table-bordered table-striped table-hover align-middle">
                                            <thead class="table-info">
                                            <tr>
                                                <!--        <th style="width:60px;">ID</th>-->
                                                <th>Name</th>
                                                <th>Count</th>
                                            </tr>
                                            </thead>
                                            <tbody></tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>

                            <div class="accordion-item">
                                <h2 class="accordion-header" id="panelsStayOpen-headingTwo">
                                    <button class="accordion-button py-1 px-2 small" type="button"
                                            data-bs-toggle="collapse"
                                            data-bs-target="#panelsStayOpen-collapseTwo" aria-expanded="true"
                                            aria-controls="panelsStayOpen-collapseTwo">
                                        Additional products
                                    </button>
                                </h2>
                                <div id="panelsStayOpen-collapseTwo" class="accordion-collapse collapse show"
                                     aria-labelledby="panelsStayOpen-headingTwo">
                                    <div class="accordion-body">
                                        <table id="fridge-additional-table"
                                               class="table table-sm table-bordered table-striped table-hover align-middle">
                                            <thead class="table-info">
                                            <tr>
                                                <!--        <th style="width:60px;">ID</th>-->
                                                <th>Name</th>
                                                <th>Count</th>
                                            </tr>
                                            </thead>
                                            <tbody></tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>


                        </div>

                    </div>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="container mt-4">
                <div class="card shadow-sm rounded-3 border-0">
                    <div class="card-body">
                        <div class="d-flex align-items-center mb-3">
                            <h4 class="card-title me-3">Shopping List</h4>


                            <div class="dropdown">
                                <button class="btn btn-primary dropdown-toggle d-flex align-items-center" type="button" id="emailDropdownBtn" data-bs-toggle="dropdown" aria-expanded="false">
                                    <i class="fa-regular fa-envelope me-1"></i> Send Email
                                </button>
                                <ul class="dropdown-menu" aria-labelledby="emailDropdownBtn">
                                    <li><a class="dropdown-item" href="#" data-email="zuzua.tel@gmail.com,sebatombdg@gmail.com">all</a></li>
                                    <li><a class="dropdown-item" href="#" data-email="zuzua.tel@gmail.com">zuzua.tel@gmail.com</a></li>
                                    <li><a class="dropdown-item" href="#" data-email="sebatombdg@gmail.com">sebatombdg@gmail.com</a></li>
                                </ul>
                            </div>

                            <!-- Notification bell -->
                            <div id="notify-container">
                                <i id="notify-icon" class="fa fa-bell text-secondary"></i>
                                <span id="notify-badge" class="badge bg-danger rounded-pill d-none">!</span>
                            </div>
                        </div>

                        <!-- Table -->
                        <table id="item-table" class="table table-sm table-striped table-bordered align-middle">
                            <thead class="table-info">
                            <tr>
                                <!--        <th style="width:60px;">ID</th>-->
                                <th>Product</th>
                                <th>Count</th>
                                <th style="width:50px;"></th>
                            </tr>
                            </thead>
                            <tbody></tbody>
                            <tfoot>
                            <tr>
                                <!--        <td class="text-muted"></td>-->
                                <td><input type="text" id="new-name" class="form-control" placeholder="Name" required>
                                </td>
                                <td><input type="number" id="new-count" class="form-control" placeholder="Count"
                                           required></td>
                                <td class="text-center">
                                    <button id="add-btn" class="btn btn-success btn-sm"><i class="fa fa-plus"></i>
                                    </button>
                                </td>
                            </tr>
                            </tfoot>
                        </table>

                    </div>
                </div>
            </div>
        </div>
    </div>

</div>


<script>


    const API_BASE = "http://localhost:8080";
    const tableBody = document.querySelector("#item-table tbody");
    const nameInput = document.getElementById("new-name");
    const countInput = document.getElementById("new-count");
    const addBtn = document.getElementById("add-btn");
    const notifyIcon = document.getElementById("notify-icon");
    const notifyBadge = document.getElementById("notify-badge");

    const recentAdded = new Set();

    const fridgeBodyBasic = document.querySelector("#fridge-basic-table tbody");
    const fridgeAdditionalBody = document.querySelector("#fridge-additional-table tbody");
    const fillFridgeBtn = document.getElementById("fill-fridge-btn");

    document.querySelectorAll(".dropdown-item").forEach(item => {
        item.addEventListener("click", async (e) => {
            e.preventDefault();
            const email = item.getAttribute("data-email");

            try {
                const res = await fetch(`/emails?to=${encodeURIComponent(email)}`, {
                    method: "POST"
                });
                if (res.ok) {
                    alert(`Email request sent to ${email}!`);
                } else {
                    alert("Failed to send email.");
                }
            } catch (err) {
                console.error(err);
                alert("Error sending email.");
            }
        });
    });

    async function loadFridgeItems() {
        try {
            const res = await fetch(`${API_BASE}/fridges/tom`);
            if (!res.ok) throw new Error(`GET /fridges/tom failed: ${res.status}`);
            const data = await res.json();
            const basicItems = data.basic
            const additionalItems = data.items
            fridgeBodyBasic.innerHTML = "";
            basicItems.forEach(item => {
                const row = document.createElement("tr");
                row.innerHTML = `
<!--        <td>${item.id}</td>-->
        <td>${item.name}</td>
        <td>${item.count}</td>
      `;
                fridgeBodyBasic.appendChild(row);
            });

            fridgeAdditionalBody.innerHTML = "";
            additionalItems.forEach(item => {
                const row = document.createElement("tr");
                row.innerHTML = `
<!--        <td>${item.id}</td>-->
        <td>${item.name}</td>
        <td>${item.count}</td>
      `;
                fridgeAdditionalBody.appendChild(row);
            });
        } catch (err) {
            console.error(err);
        }
    }

    fillFridgeBtn.addEventListener("click", async () => {
        fillFridgeBtn.disabled = true;
        try {
            const res = await fetch(`${API_BASE}/fridges/tom/fill`, {
                method: "POST"
            });
            if (!res.ok) throw new Error(`POST /fridges/tom/fill failed: ${res.status}`);

            // Reload fridge table after successful fill
            await loadFridgeItems();
            await loadItems();
        } catch (err) {
            console.error(err);
            alert("Nie udało się napełnić lodówki!");
        } finally {
            fillFridgeBtn.disabled = false;
        }
    });

    const emptyFridgeBtn = document.getElementById("empty-fridge-btn");

    emptyFridgeBtn.addEventListener("click", async () => {
        emptyFridgeBtn.disabled = true;
        try {
            const res = await fetch(`${API_BASE}/fridges/tom/empty`, {
                method: "POST"
            });
            if (!res.ok) throw new Error(`POST /fridges/tom/empty failed: ${res.status}`);

            // Reload fridge table after empty
            await loadFridgeItems();
        } catch (err) {
            console.error(err);
            alert("Nie udało się opróżnić lodówki!");
        } finally {
            emptyFridgeBtn.disabled = false;
        }
    });

    // Render a single row
    function renderRow(item) {
        const key = `${item.name}`;
        const row = document.createElement("tr");
        row.dataset.key = key;
        row.innerHTML = `
<!--        <td>${item.id}</td>-->
        <td>${item.name}</td>
        <td>${item.count}</td>
        <td class="text-center">
          <i class="fa fa-trash" title="Delete"></i>
        </td>
      `;
        row.querySelector(".fa-trash").addEventListener("click", () => deleteItem(item.name, row));
        return row;
    }

    // Insert or update row, keep table sorted by ID
    function renderOrUpdateRow(item) {
        const key = `${item.name}`;
        let row = document.querySelector(`tr[data-key="${key}"]`);

        if (row) {
            // Update row contents
            // row.cells[0].textContent = item.id;
            row.cells[0].textContent = item.name;
            row.cells[1].textContent = item.count;

            // Remove row to re-insert in sorted position
            row.remove();
        } else {
            row = renderRow(item);
        }

        // Insert sorted by ID
        let inserted = false;
        for (const existingRow of tableBody.querySelectorAll("tr")) {
            const existingId = parseInt(existingRow.cells[0].textContent, 10);
            if (item.id < existingId) {
                tableBody.insertBefore(row, existingRow);
                inserted = true;
                break;
            }
        }
        if (!inserted) tableBody.appendChild(row);

        // Highlight new/updated row
        row.classList.add("highlight");
    }

    // Initial load
    async function loadItems() {
        try {
            const res = await fetch(`${API_BASE}/items`);
            if (!res.ok) throw new Error(`GET /items failed: ${res.status}`);
            const items = (await res.json()).sort((a, b) => a.id - b.id);
            tableBody.innerHTML = "";
            items.forEach(item => tableBody.appendChild(renderRow(item)));
        } catch (err) {
            console.error(err);
        }
    }

    // Add/update item via PUT
    addBtn.addEventListener("click", async () => {
        const name = nameInput.value.trim();
        const count = parseInt(countInput.value, 10);
        if (!name || Number.isNaN(count)) return;

        addBtn.disabled = true;
        try {
            const res = await fetch(`${API_BASE}/items`, {
                method: "PUT",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({name, count})
            });
            if (!res.ok) throw new Error(`PUT failed: ${res.status}`);
            const item = await res.json();
            recentAdded.add(`${item.name}:${item.count}`);
            renderOrUpdateRow(item);

            nameInput.value = "";
            countInput.value = "";
        } catch (err) {
            console.error(err);
        } finally {
            addBtn.disabled = false;
        }
    });

    // Delete item
    async function deleteItem(name, row) {
        if (!confirm("Delete this item?")) return;
        try {
            const res = await fetch(`${API_BASE}/items/${name}`, {method: "DELETE"});
            if (!res.ok) throw new Error(`DELETE failed: ${res.status}`);
            row.remove();
        } catch (err) {
            console.error(err);
        }
    }

    // WebSocket
    function setupWebSocket() {
        let ws;
        let reconnectDelay = 2000;

        const connect = () => {
            ws = new WebSocket("ws://localhost:8080/notifications");

            ws.onopen = () => {
                reconnectDelay = 2000;
                notifyBadge.classList.add("d-none");
                notifyIcon.className = "fa fa-bell text-primary";
            };

            ws.onmessage = (msg) => {
                try {
                    const item = JSON.parse(msg.data);
                    const key = `${item.name}`;
                    if (recentAdded.has(key)) {
                        recentAdded.delete(key);
                        return;
                    }

                    notifyBadge.classList.remove("d-none");
                    notifyIcon.className = "fa fa-bell text-warning";

                    renderOrUpdateRow(item);

                } catch (e) {
                    console.warn("WS error:", msg.data);
                }
            };

            ws.onclose = () => {
                notifyIcon.className = "fa fa-bell fa-spin text-secondary";
                setTimeout(connect, reconnectDelay);
                reconnectDelay = Math.min(30000, reconnectDelay * 2);
            };
            ws.onerror = () => ws.close();
        };
        connect();
    }

    // Notification bell click
    document.getElementById("notify-container").addEventListener("click", () => {
        notifyBadge.classList.add("d-none");
        notifyIcon.className = "fa fa-bell text-primary";
        document.querySelectorAll("tr.highlight").forEach(tr => {
            tr.classList.add("fadeout");
            setTimeout(() => tr.classList.remove("highlight", "fadeout"), 1500);
        });
    });

    loadFridgeItems();
    loadItems();
    setupWebSocket();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
