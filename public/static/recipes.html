<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recipes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            padding: 2rem;
        }

        .clickable-tag, .clickable-course {
            cursor: pointer;
        }

        .card .badge.bg-info,
        .card .badge.bg-primary {
            cursor: pointer; /* pointer on hover */
        }

        .card .badge.bg-info:hover,
        .card .badge.bg-primary:hover {
            opacity: 0.85; /* slight visual feedback */
        }
    </style>
</head>
<body class="container position-relative">
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Fridge</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
                <a class="nav-link active" href="/recipes.html">Recipes</a>
                <a class="nav-link active" href="/quotes">Quotes</a>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h3>
        Recipes <span id="recipe-count" class="badge bg-secondary ms-2">0</span>
    </h3>

    <!-- Course Filter -->
    <div class="mb-3">
        <label for="courseFilter" class="form-label">Filter by course:</label>
        <div id="courseContainer" class="d-flex flex-wrap border p-2 rounded" style="min-height:40px; cursor:text;"
             onclick="document.getElementById('courseInput').focus()">
            <input type="text" id="courseInput" class="border-0 flex-grow-1" placeholder="Type course and press Enter"
                   style="outline:none;">
        </div>
    </div>

    <!-- Tag Filter -->
    <div class="mb-3">
        <label for="tagFilter" class="form-label">Filter by tags:</label>
        <div id="tagContainer" class="d-flex flex-wrap border p-2 rounded" style="min-height:40px; cursor:text;"
             onclick="document.getElementById('tagInput').focus()">
            <input type="text" id="tagInput" class="border-0 flex-grow-1" placeholder="Type tag and press Enter"
                   style="outline:none;">
        </div>
    </div>

    <div id="recipes" class="row g-4 mt-2">
        <!-- Cards will be inserted here -->
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="recipeModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal-title"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer">
                <a id="modal-url" class="btn btn-primary" target="_blank">Go to Recipe</a>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<script>
    let recipes = [];
    let filterTags = [];
    let filterCourses = [];

    async function loadRecipes() {
        const res = await fetch("http://localhost:8081/recipes");
        recipes = await res.json();
        renderRecipes(recipes);
    }

    // Utility: create badge
    function createBadge(name, type) {
        return `<span class="badge ${type === 'tag' ? 'bg-info text-dark' : 'bg-primary text-white'} me-1 mb-1 d-flex align-items-center">
        ${name} <i class="fa fa-times ms-1" style="cursor:pointer;" data-name="${name}" data-type="${type}"></i>
    </span>`;
    }

    // Add badge to container
    function addBadge(containerId, name, type) {
        const container = document.getElementById(containerId);
        const badgeHTML = createBadge(name, type);
        container.insertAdjacentHTML('beforeend', badgeHTML);
        applyFilter();
    }

    // Remove badge listener
    document.addEventListener('click', (e) => {
        if (e.target.tagName === 'I' && e.target.dataset.name) {
            const name = e.target.dataset.name;
            const type = e.target.dataset.type;
            if (type === 'tag') filterTags = filterTags.filter(t => t !== name);
            else filterCourses = filterCourses.filter(c => c !== name);
            e.target.parentElement.remove();
            applyFilter();
        }
    });

    // Handle input Enter key
    function setupInput(inputId, containerId, type) {
        const input = document.getElementById(inputId);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && input.value.trim() !== '') {
                const val = input.value.trim();
                const arr = type === 'tag' ? filterTags : filterCourses;
                if (!arr.includes(val)) {
                    arr.push(val);
                    addBadge(containerId, val, type);
                }
                input.value = '';
                e.preventDefault();
            }
        });
    }

    setupInput('tagInput', 'tagContainer', 'tag');
    setupInput('courseInput', 'courseContainer', 'course');

    // Filtering
    function applyFilter() {
        const filtered = recipes.filter(recipe => {
            const tagsMatch = filterTags.length === 0 || filterTags.every(tag => recipe.Tags.some(t => t.toLowerCase().includes(tag.toLowerCase())));
            const coursesMatch = filterCourses.length === 0 || filterCourses.every(c => recipe.Course.some(r => r.toLowerCase().includes(c.toLowerCase())));
            return tagsMatch && coursesMatch;
        });
        renderRecipes(filtered);
    }

    // Render recipes cards (simplified)
    function renderRecipes(list) {
        document.getElementById('recipe-count').innerText = list.length;
        const container = document.getElementById('recipes');
        container.innerHTML = '';

        list.forEach((recipe, idx) => {
            const previewIngredients = recipe.Ingredients.slice(0, 4).join(', ') + (recipe.Ingredients.length > 4 ? '...' : '');
            const courseBadges = recipe.Course?.map(c => `<span class="badge bg-primary text-white me-1">${c}</span>`).join('') || '';
            const tagBadges = recipe.Tags?.map(t => `<span class="badge bg-info text-dark me-1">${t}</span>`).join('') || '';

            const card = `
        <div class="col-md-4">
            <div class="card h-100 shadow-sm d-flex flex-column">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">
                        <a href="${recipe.Url}" target="_blank" class="text-decoration-none">
                            ${recipe.Title} <i class="fa fa-link ms-1"></i>
                        </a>
                    </h5>
                    <p class="card-text"><strong>Ingredients:</strong> ${previewIngredients}</p>
                    <div class="mb-2">${courseBadges}</div>
                    <div class="mb-2">${tagBadges}</div>
                    <div class="d-flex justify-content-between mt-auto">
                        <button class="btn btn-sm btn-outline-primary" onclick="showRecipeModal(${idx})">Show full recipe</button>
                    </div>
                </div>
            </div>
        </div>
        `;
            container.insertAdjacentHTML('beforeend', card);
        });

        // Make tags on cards clickable
        document.querySelectorAll('.card .badge.bg-info').forEach(el => {
            el.addEventListener('click', (e) => {
                const tag = e.target.textContent.trim();
                if (!filterTags.includes(tag)) {
                    filterTags.push(tag);
                    addBadge('tagContainer', tag, 'tag');
                }
            });
        });

        // Make courses on cards clickable
        document.querySelectorAll('.card .badge.bg-primary').forEach(el => {
            el.addEventListener('click', (e) => {
                const course = e.target.textContent.trim();
                if (!filterCourses.includes(course)) {
                    filterCourses.push(course);
                    addBadge('courseContainer', course, 'course');
                }
            });
        });
    }

    // Modal function remains unchanged
    function showRecipeModal(idx) {
        const recipe = recipes[idx];
        const tagsHtml = recipe.Tags?.length ? recipe.Tags.map(tag => `<span class="badge bg-info text-dark me-1">${tag}</span>`).join('') : '';
        const courseHtml = recipe.Course?.length ? recipe.Course.map(c => `<span class="badge bg-primary text-white me-1">${c}</span>`).join('') : '';

        document.getElementById('modal-title').innerText = recipe.Title;
        document.getElementById('modal-body').innerHTML = `
        <p><strong>Courses:</strong> ${courseHtml}</p>
        <p><strong>Tags:</strong> ${tagsHtml}</p>
        <h6>Ingredients:</h6>
        <ul>${recipe.Ingredients.map(i => `<li>${i}</li>`).join('')}</ul>
        <h6>Instructions:</h6>
        <ol>${recipe.InstructionsSteps.map(s => `<li>${s}</li>`).join('')}</ol>
    `;
        document.getElementById('modal-url').href = recipe.Url;
        bootstrap.Modal.getOrCreateInstance(document.getElementById('recipeModal')).show();
    }

    document.addEventListener("DOMContentLoaded", loadRecipes);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
